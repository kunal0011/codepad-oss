apiVersion: apps/v1
kind: Deployment
metadata:
  name: codepad-collaboration
  namespace: codepad
  labels:
    app: codepad-collaboration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codepad-collaboration
  template:
    metadata:
      labels:
        app: codepad-collaboration
    spec:
      serviceAccountName: codepad-collaboration
      containers:
        - name: collaboration
          image: codepad/collaboration:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              protocol: TCP
          envFrom:
            - secretRef:
                name: codepad-secrets
            - configMapRef:
                name: codepad-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: codepad-collaboration
  namespace: codepad
spec:
  type: ClusterIP
  selector:
    app: codepad-collaboration
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
