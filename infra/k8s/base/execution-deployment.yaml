apiVersion: apps/v1
kind: Deployment
metadata:
  name: codepad-execution
  namespace: codepad
  labels:
    app: codepad-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codepad-execution
  template:
    metadata:
      labels:
        app: codepad-execution
    spec:
      serviceAccountName: codepad-execution
      containers:
        - name: execution
          image: codepad/execution-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              protocol: TCP
          env:
            - name: EXEC_PORT
              value: "8081"
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: MAX_CONTAINER_MEMORY_MB
              value: "512"
            - name: MAX_CONTAINER_CPU_CORES
              value: "1"
            - name: CONTAINER_POOL_SIZE
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: codepad-execution
  namespace: codepad
spec:
  type: ClusterIP
  selector:
    app: codepad-execution
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
