apiVersion: apps/v1
kind: Deployment
metadata:
  name: codepad-api
  namespace: codepad
  labels:
    app: codepad-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codepad-api
  template:
    metadata:
      labels:
        app: codepad-api
    spec:
      serviceAccountName: codepad-api
      containers:
        - name: api
          image: codepad/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: codepad-secrets
            - configMapRef:
                name: codepad-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: codepad-api
  namespace: codepad
spec:
  type: ClusterIP
  selector:
    app: codepad-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
