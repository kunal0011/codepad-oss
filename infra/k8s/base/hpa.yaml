apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codepad-api-hpa
  namespace: codepad
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codepad-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
