apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: codepad-config
    namespace: codepad
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=debug
      - API_PORT=8080
      - DATABASE_URL=postgresql://codepad:codepad@postgres:5432/codepad
      - REDIS_URL=redis://redis.codepad.svc.cluster.local:6379
      - EXECUTION_ENGINE_URL=http://codepad-execution:8081
      - COLLABORATION_WS_PORT=8082
      - FRONTEND_URL=http://localhost:3000
      - API_URL=http://localhost:8080

secretGenerator:
  - name: codepad-secrets
    namespace: codepad
    literals:
      - JWT_SECRET=local-dev-secret-change-in-production-32chars

images:
  - name: codepad/api
    newName: codepad/api
    newTag: latest
  - name: codepad/collaboration
    newName: codepad/collaboration
    newTag: latest
  - name: codepad/execution-engine
    newName: codepad/execution-engine
    newTag: latest
  - name: codepad/web
    newName: codepad/web
    newTag: latest
