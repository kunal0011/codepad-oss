name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codepad
          POSTGRES_PASSWORD: codepad
          POSTGRES_DB: codepad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@codepad/shared --workspace=@codepad/database
      - run: npm run test --workspace=@codepad/api
        env:
          DATABASE_URL: postgresql://codepad:codepad@localhost:5432/codepad_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-32chars
          NODE_ENV: test

  test-collaboration:
    name: Test Collaboration
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@codepad/shared
      - run: npm run test --workspace=@codepad/collaboration
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-32chars
          NODE_ENV: test

  test-execution-engine:
    name: Test Execution Engine
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - working-directory: apps/execution-engine
        run: |
          go mod tidy
          go vet ./...
          go test ./... -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
      - name: Run npm audit
        run: npm audit --audit-level=high || true

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-collaboration, test-execution-engine, security-scan]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api
            file: infra/docker/Dockerfile.api
            context: .
          - service: collaboration
            file: infra/docker/Dockerfile.collaboration
            context: .
          - service: execution
            file: infra/docker/Dockerfile.execution
            context: apps/execution-engine
          - service: web
            file: infra/docker/Dockerfile.web
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository }}/codepad-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
      - name: Deploy to dev
        run: |
          echo "Deploying to dev environment..."
          # kubectl set image deployment/codepad-api api=ghcr.io/${{ github.repository }}/codepad-api:${{ github.sha }} -n codepad
          # kubectl set image deployment/codepad-collaboration collaboration=ghcr.io/${{ github.repository }}/codepad-collaboration:${{ github.sha }} -n codepad
          # kubectl set image deployment/codepad-execution execution=ghcr.io/${{ github.repository }}/codepad-execution:${{ github.sha }} -n codepad
          # kubectl rollout status deployment -n codepad --timeout=300s
